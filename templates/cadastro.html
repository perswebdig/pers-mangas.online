{% extends "base.html" %}
{% block title %}Cadastro - {{ config.site_name }}{% endblock %}
{% block content %}
<div class="container" style="max-width: 450px; margin: 50px auto; padding: 20px;">
    <div class="card" style="background: var(--surface); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0,0,0,0.4);">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary); font-size: 2rem;">
            📝 Criar Conta
        </h2>
        
        <div id="error-message" class="hidden" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
        </div>
        
        <div id="success-message" class="hidden" style="background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 12px; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
        </div>
        
        <form id="cadastro-form">
            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">
                    Usuário
                </label>
                <input 
                    type="text" 
                    name="username" 
                    id="username"
                    class="search-input" 
                    style="width: 100%; background: var(--background); border: 2px solid var(--border); border-radius: 8px; padding: 14px; color: white; font-size: 1rem; transition: border 0.3s;" 
                    placeholder="Escolha um nome de usuário" 
                    required
                    minlength="3"
                    autocomplete="username"
                    onfocus="this.style.borderColor='var(--primary)'"
                    onblur="this.style.borderColor='var(--border)'">
                <small style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; display: block;">
                    Mínimo 3 caracteres
                </small>
            </div>
            
            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">
                    Email
                </label>
                <input 
                    type="email" 
                    name="email" 
                    id="email"
                    class="search-input" 
                    style="width: 100%; background: var(--background); border: 2px solid var(--border); border-radius: 8px; padding: 14px; color: white; font-size: 1rem; transition: border 0.3s;" 
                    placeholder="seu@email.com" 
                    required
                    autocomplete="email"
                    onfocus="this.style.borderColor='var(--primary)'"
                    onblur="this.style.borderColor='var(--border)'">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">
                    Senha
                </label>
                <input 
                    type="password" 
                    name="password" 
                    id="password"
                    class="search-input" 
                    style="width: 100%; background: var(--background); border: 2px solid var(--border); border-radius: 8px; padding: 14px; color: white; font-size: 1rem; transition: border 0.3s;" 
                    placeholder="Crie uma senha segura" 
                    required
                    minlength="6"
                    autocomplete="new-password"
                    onfocus="this.style.borderColor='var(--primary)'"
                    onblur="this.style.borderColor='var(--border)'">
                <small style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; display: block;">
                    Mínimo 6 caracteres
                </small>
            </div>
            
            <button 
                type="submit" 
                id="cadastro-btn" 
                class="btn btn-primary" 
                style="width: 100%; padding: 14px; font-weight: bold; font-size: 1.1rem; border-radius: 8px; transition: all 0.3s;">
                Cadastrar
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
            <p style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                Já tem uma conta?
            </p>
            <a 
                href="/login" 
                style="color: var(--secondary); text-decoration: none; font-weight: bold; font-size: 1rem; transition: opacity 0.3s;"
                onmouseover="this.style.opacity='0.8'"
                onmouseout="this.style.opacity='1'">
                Entre aqui →
            </a>
        </div>
    </div>
</div>

<script>
document.getElementById('cadastro-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('cadastro-btn');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    const originalText = btn.innerText;
    
    // Limpar mensagens anteriores
    errorDiv.classList.add('hidden');
    errorDiv.innerText = '';
    successDiv.classList.add('hidden');
    successDiv.innerText = '';
    
    // Validações básicas no frontend
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (username.length < 3) {
        errorDiv.innerText = 'O nome de usuário deve ter no mínimo 3 caracteres.';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    if (password.length < 6) {
        errorDiv.innerText = 'A senha deve ter no mínimo 6 caracteres.';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    if (!email.includes('@')) {
        errorDiv.innerText = 'Por favor, insira um email válido.';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    try {
        // Desabilitar botão e mostrar feedback
        btn.innerText = '⏳ Cadastrando...';
        btn.disabled = true;
        btn.style.opacity = '0.6';
        
        const formData = new FormData(e.target);
        
        const res = await fetch('/api/auth/cadastro', { 
            method: 'POST', 
            body: formData 
        });
        
        const data = await res.json();
        
        if (res.ok) {
            // Sucesso - mostrar mensagem e redirecionar
            btn.innerText = '✓ Sucesso!';
            btn.style.background = '#10b981';
            
            successDiv.innerText = '✓ Cadastro realizado com sucesso! Redirecionando para o login...';
            successDiv.classList.remove('hidden');
            
            // Redirecionar após 2 segundos
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            // Erro - mostrar mensagem
            throw new Error(data.detail || 'Erro ao realizar cadastro');
        }
    } catch (err) {
        console.error('Erro no cadastro:', err);
        
        // Mostrar mensagem de erro
        let errorMessage = err.message || 'Erro ao conectar com o servidor. Verifique sua conexão.';
        
        // Mensagens de erro mais amigáveis
        if (errorMessage.includes('já existe')) {
            errorMessage = '❌ Este nome de usuário já está sendo usado. Tente outro.';
        } else if (errorMessage.includes('já cadastrado')) {
            errorMessage = '❌ Este email já está cadastrado. Tente fazer login ou use outro email.';
        }
        
        errorDiv.innerText = errorMessage;
        errorDiv.classList.remove('hidden');
        
        // Restaurar botão
        btn.innerText = originalText;
        btn.disabled = false;
        btn.style.opacity = '1';
        
        // Focar no primeiro campo
        document.getElementById('username').focus();
    }
});

// Limpar erros ao digitar
const inputs = ['username', 'email', 'password'];
inputs.forEach(inputId => {
    document.getElementById(inputId).addEventListener('input', () => {
        document.getElementById('error-message').classList.add('hidden');
        document.getElementById('success-message').classList.add('hidden');
    });
});
</script>
{% endblock %}
